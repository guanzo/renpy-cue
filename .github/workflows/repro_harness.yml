name: repro-harness-exit

on:
  workflow_dispatch:

jobs:
  repro:
    name: harness exit propagation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run faithful worker pattern
        run: |
          bash bin/repro_harness_worker.sh
          echo "STEP-EXIT=$?"
