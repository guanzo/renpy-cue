name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Run the Ren'Py testcases harness against pinned SDKs -- the code path
  # pytest cannot cover (real .rpy screens + the 7.x/Py2 runtime). The SDK
  # launcher (renpy.sh at the SDK root) is passed straight to
  # bin/test_harness.sh, which sniffs the bundled major version from
  # renpy/__init__.py and runs the matching DSL template.
  testcases:
    name: testcases (Ren'Py ${{ matrix.renpy }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Corners only: oldest 7.x, popular + supported-floor 7.x (BeingADik),
          # newest 7.x, earliest and newest 8.x. The testcases DSL splits by
          # generation, not Python version: 7.x and 8.0-8.4 share the old
          # grammar (legacy template), 8.5+ the new one (modern). `dsl` mirrors
          # what the harness detects, so this job can wrap the modern legs in
          # xvfb (single-process) while leaving legacy (per-worker Xvfb) alone.
          - renpy: "7.2.2"
            dsl: legacy
            os: ubuntu-22.04
          - renpy: "7.4.10"
            dsl: legacy
            os: ubuntu-22.04
          - renpy: "7.5.3"
            dsl: legacy
            os: ubuntu-22.04
          - renpy: "8.1.3"
            dsl: legacy
            os: ubuntu-22.04
          - renpy: "8.5.3"
            dsl: modern
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      # Explicit fixture root (empty is fine -- CueDatabase.open() creates all
      # subdirs at init). Never let the run inherit a machine-local pointer
      # file, which would override the env var.
      RENPY_CUE_DIR: ${{ github.workspace }}/tests/fixtures/data
      # Headless runner: no audio device. The testcases play no audio.
      SDL_AUDIODRIVER: dummy
      # Pinned johnvansickle static build the harness encodes with (ffmpeg +
      # ffprobe). Versioned so every leg and every run produces byte-identical
      # test video.
      FFMPEG_VERSION: "7.0.2"
      # Legacy legs run serial (1 worker): parallel workers each boot their own
      # engine on a per-worker Xvfb, and on this 2-vCPU runner the concurrent
      # llvmpipe software-GL boot is the source of the "Could not set video
      # mode" (7.2.x) and SIGSEGV (8.1.3) flakes -- while measuring no faster
      # than one engine (68 tests parallel ~148s vs 70 tests serial ~111s on
      # the modern leg). WORKERS=1 inherits the xvfb-run display below. The
      # modern leg is single-process regardless.
      CUE_LEGACY_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4

      # Pinned SDKs are immutable, so a version-keyed cache never goes stale.
      # Restoring the extracted tree skips the 100-150MB download + tar.bz2
      # decompress on every run.
      - name: Cache Ren'Py SDK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: renpy-${{ matrix.renpy }}-sdk
          key: renpy-sdk-${{ matrix.renpy }}-${{ runner.os }}

      - name: Download Ren'Py SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fL "https://www.renpy.org/dl/${{ matrix.renpy }}/renpy-${{ matrix.renpy }}-sdk.tar.bz2" -o sdk.tar.bz2
          tar xjf sdk.tar.bz2

      - name: Set SDK_DIR
        run: echo "SDK_DIR=$PWD/renpy-${{ matrix.renpy }}-sdk" >> "$GITHUB_ENV"

      # The video-variant testcases encode with real ffmpeg/ffprobe; the ubuntu
      # runner images don't ship them, so a job launch fails with OSError errno 2
      # (the "fix weird layout shift" era of CI failures). Install before run.
      # setup-ffmpeg@v3 resolved the latest johnvansickle build with a single
      # unre-tried fetch, and a transient failure on that hop killed the job
      # (seen 2/2 on the 8.1.3 leg). Download the pinned static build with curl
      # retries instead, and append it to PATH. Pinned so encode output stays
      # identical across runners and over time (the `release` tag moves). The
      # extracted tree is cached (version-keyed, like the SDK) so most runs skip
      # the download entirely.
      - name: Cache ffmpeg
        uses: actions/cache@v4
        id: cache-ffmpeg
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}

      - name: Install ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          cd "$RUNNER_TEMP/ffmpeg"
          curl -fL --retry 4 --retry-delay 5 --retry-all-errors \
            -o ffmpeg.tar.xz \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-${FFMPEG_VERSION}-amd64-static.tar.xz"
          tar xJf ffmpeg.tar.xz
          rm ffmpeg.tar.xz

      - name: Add ffmpeg to PATH
        run: echo "$RUNNER_TEMP/ffmpeg/ffmpeg-${FFMPEG_VERSION}-amd64-static" >> "$GITHUB_PATH"

      # The `test` command is uses_display=True and the legacy legs force
      # SDL_VIDEODRIVER=x11 -- both need a real X server. xvfb provides it.
      - name: Run testcases
        # Explicit `bash` invocation: the repo lives on a filesystem that
        # doesn't persist the exec bit (core.fileMode=false), so the scripts
        # aren't executable in the working tree.
        # Every leg is single-process (legacy legs are serial via
        # CUE_LEGACY_WORKERS=1, modern is always single-process), so all legs
        # wrap in a single xvfb-run display. Parallel per-worker Xvfb was the
        # source of the boot flakes -- see the CUE_LEGACY_WORKERS comment above.
        run: xvfb-run -a bash bin/test_harness.sh "$SDK_DIR/renpy.sh"

      # Python 2.7 (Ren'Py 7.x) is the base runtime requirement, but pytest runs
      # under py3 -- so py3.6+ stdlib APIs (e.g. zipfile.ZipInfo.is_dir) and
      # py2-invalid syntax slip through the fast gate. The harness testcases
      # don't exercise every code path, so this explicit py2 gate compiles every
      # cue_lib module, boots import cue_lib, and runs targeted smokes. Runs on
      # the 7.4.10 leg where the SDK is present.
      - name: Python 2.7 compatibility check
        if: matrix.renpy == '7.4.10'
        run: bash bin/py2_check.sh "$SDK_DIR"

  # Fast gate: pyright + 120-char lint, then the pytest suite, under the
  # modern toolchain. Mirrors the /lint and /test skills via bin/*.sh.
  check:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      # Cache the poetry venv in-project. The key includes the exact resolved
      # Python patch because a venv's interpreter symlink is tied to that
      # path -- when the hosted image bumps the patch the key changes and the
      # venv is rebuilt, instead of restoring a dead one.
      - name: Cache poetry venv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: poetry-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install poetry + deps
        run: |
          python -m pip install --upgrade pip "poetry==2.4.1"
          poetry config virtualenvs.in-project true
          poetry install

      # bin/lint.sh calls bare `pyright` (not `poetry run pyright`), so the
      # project venv's bin/ must be on PATH.
      #
      # pyrightconfig.json's extraPaths point at the SDK in .local/ (a
      # gitignored, local-only location this runner must recreate). Download the
      # SDK and unpack it into .local/ so pyright can resolve renpy.* on this
      # clean runner. Uses its own cache key (not the harness job's) so the two
      # jobs can't race on the same key with different path layouts.
      - name: Cache Ren'Py SDK for pyright
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: .local/renpy-sdk/renpy-8.5.3-sdk
          key: pyright-sdk-8.5.3-${{ runner.os }}

      - name: Download Ren'Py SDK for pyright
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .local/renpy-sdk
          curl -fL "https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2" -o sdk.tar.bz2
          tar xjf sdk.tar.bz2 -C .local/renpy-sdk

      - name: Lint
        run: |
          export PATH="$(poetry env info -p)/bin:$PATH"
          bash bin/lint.sh

      - name: Test
        run: bash bin/test.sh
