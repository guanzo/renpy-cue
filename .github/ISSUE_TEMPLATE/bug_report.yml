name: Bug report
description: Report a problem with Ren'Py Cue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please be specific and attach
        screenshots if applicable.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Be specific. What did you do, and what state was Cue in?
      placeholder: |
        1. Open the Cue overlay with ` (backtick)
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: renpy_version
    attributes:
      label: Ren'Py version
      description: e.g. 7.4.10 or 8.5.3
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Which game and version?
      description: Which visual novel version were you using when the bug happened?

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
