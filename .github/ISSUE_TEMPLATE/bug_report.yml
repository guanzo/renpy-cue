name: Bug report
description: Report a problem with Ren'Py Cue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can --
        the more detail, the faster it can be diagnosed.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Be specific. What did you click/trigger, and what state was Cue in?
      placeholder: |
        1. Open the Cue overlay with ` (backtick)
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: renpy_version
    attributes:
      label: Ren'Py version
      description: e.g. 7.4.10 or 8.5.3
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game Cue is installed into
      description: Which visual novel were you using when the bug happened?

  - type: dropdown
    id: ffmpeg
    attributes:
      label: Does the bug involve video speed variants?
      description: ffmpeg is only required for the video speed-variant features.
      options:
        - "No"
        - "Yes"
      default: 0

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Paste any errors from the game's `errors.txt` or the console here. If the bug
        crashes the game, include the traceback.
      render: shell

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Screenshots, video, or other context that might help.
